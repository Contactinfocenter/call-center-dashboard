<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Call Center Dashboard - Supabase Live</title>
  <style>
    :root { --primary: #4f46e5; --bg: #f3f4f6; --card: white; --text: #1f2937; --muted: #6b7280; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
    .container { max-width: 1200px; margin: 0 auto; }
    #auth-container { max-width: 400px; margin: 100px auto; background: var(--card); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    #dashboard { display: none; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
    .status-pill { padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .status-completed { background: #d1fae5; color: #065f46; }
    .status-other { background: #fef3c7; color: #92400e; }
    button { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; background: var(--primary); color: white; }
    #logoutBtn { background: #ef4444; }
  </style>
</head>
<body>

  <div id="auth-container">
    <h2>Secure Access</h2>
    <p>Sign in to view analytics</p>
    <button id="loginBtn">Login with Magic Link</button>
  </div>

  <div id="dashboard" class="container">
    <header>
      <h1>Call Center Dashboard</h1>
      <button id="logoutBtn">Sign Out</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Calls</h3><div class="value" id="total-calls">—</div></div>
      <div class="stat-card"><h3>Unique Callers</h3><div class="value" id="unique-callers">—</div></div>
      <div class="stat-card"><h3>Active Agents</h3><div class="value" id="active-agents">—</div></div>
      <div class="stat-card"><h3>Avg Handle Time</h3><div class="value" id="avg-ht">—</div></div>
      <div class="stat-card"><h3>FCR %</h3><div class="value" id="fcr-percent">—</div></div>
    </div>

    <h2>Recent Calls (9 Feb 2026)</h2>
    <table>
      <thead><tr><th>Date</th><th>Full Name</th><th>Phone</th><th>Reason</th><th>Status</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://ubonrsjbcvzpoizmidlw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_5HdtgopObCBVHwqotJEQCw_ByDIyw8v';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authContainer = document.getElementById('auth-container');
    const dashboard = document.getElementById('dashboard');

    // ──── DATA FETCHING ────
    async function refreshDashboard() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="5">Loading data...</td></tr>';

      // 1. Get Stats via RPC
      const { data: stats, error: sErr } = await supabase.rpc('get_feb9_stats').single();
      if (stats) {
        document.getElementById('total-calls').textContent = stats.total_calls;
        document.getElementById('unique-callers').textContent = stats.unique_callers;
        document.getElementById('active-agents').textContent = stats.active_agents;
        document.getElementById('avg-ht').textContent = stats.avg_handle_time.toFixed(1) + 's';
        document.getElementById('fcr-percent').textContent = stats.fcr_percentage + '%';
      }

      // 2. Get 9 Feb Table Data (Filtered to exact date)
      const { data: calls, error: cErr } = await supabase
        .from('all_calls')
        .select('*')
        .gte('call_date', '2026-02-09T00:00:00')
        .lt('call_date', '2026-02-10T00:00:00')
        .order('call_date', { ascending: false });

      if (calls) {
        tbody.innerHTML = calls.map(c => `
          <tr>
            <td>${new Date(c.call_date).toLocaleTimeString()}</td>
            <td><strong>${c.full_name}</strong></td>
            <td>${c.phone_number}</td>
            <td>${c.call_reason || '—'}</td>
            <td><span class="status-pill ${c.status === 'FCR' || c.status === 'A' ? 'status-completed' : 'status-other'}">${c.status}</span></td>
          </tr>
        `).join('');
      }
    }

    // ──── AUTH & STATE ────
    document.getElementById('loginBtn').onclick = async () => {
      const email = prompt("Email:");
      if (email) await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
      alert("Check your email!");
    };

    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut();
      location.reload();
    };

    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        authContainer.style.display = 'none';
        dashboard.style.display = 'block';
        refreshDashboard();
      } else {
        authContainer.style.display = 'block';
        dashboard.style.display = 'none';
      }
    });
  </script>
</body>
</html>
