name: CSV to JSON Automation

on:
  push:
    branches: [main]
    paths:
      - 'dist/data/call_logs/*.csv'
      - 'dist/data/drops/*.csv'
      - 'scripts/csv_to_json.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Convert CSV to JSON
        # Run from root so relative paths in Python are easier to debug if needed
        run: python scripts/csv_to_json.py

      - name: Commit generated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Ensure we add the specific output directory defined in the script
          git add dist/data/calls/*.json || true
          git commit -m "Auto-update call data from CSV" || echo "No changes to commit"
          git push || echo "Push skipped"