name: CSV to JSON Automation

on:
  push:
    branches: [main]                     # Trigger on pushes to main
    paths:
      - 'scripts/csv_to_json.py'         # When script changes
      - 'dist/data/*.csv'                # When CSVs in dist/data change
  workflow_dispatch:                     # Allows manual trigger from Actions tab

permissions:
  contents: write                        # Required for git commit & push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # Important for git commit later

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Debug – show folder structure
        run: |
          pwd
          ls -la
          ls -la dist/ || echo "dist folder missing"
          ls -la dist/data/ || echo "dist/data missing"
          ls -la scripts/ || echo "scripts missing"
          ls -la scripts/csv* || echo "No csv_to_json.py found"

      - name: Convert CSV to JSON
        working-directory: scripts
        run: python csv_to_json.py

      - name: Commit generated JSON (if changes exist)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add dist/data/*.json || true
          git commit -m "Auto-update calls_agents.json from CSV" || echo "No changes to commit"
          git push || echo "Push skipped (no changes or protected branch)"
