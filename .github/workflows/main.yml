name: CSV to JSON Automation

on:
  push:
    branches: [main]
    paths:
      - 'dist/data/call_logs/*.csv'      # Triggers on new/updated call logs
      - 'dist/data/drops/*.csv'          # Triggers on new/updated drops
      - 'scripts/csv_to_json.py'         # Triggers on script changes
  workflow_dispatch:                     # Manual run from Actions tab

permissions:
  contents: write                        # Required for commit + push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # Full history for git commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Debug - Show folder structure
        run: |
          pwd
          ls -la
          ls -la dist/ || echo "dist/ missing"
          ls -la dist/data/ || echo "dist/data missing"
          ls -la dist/data/call_logs/ || echo "call_logs missing"
          ls -la dist/data/drops/ || echo "drops missing"
          ls -la data/ || echo "data/ (output) missing"
          ls -la scripts/csv* || echo "csv_to_json.py not found"

      - name: Convert CSV to JSON
        working-directory: scripts
        run: python csv_to_json.py

      - name: Commit generated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/*.json || true
          git commit -m "Auto-update calls_agents.json and drops_summary.json from CSV" || echo "No changes to commit"
          git push || echo "Push skipped (no changes or protected branch)"