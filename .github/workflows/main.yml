name: CSV to JSON Automation

on:
  push:
    branches: [main]
    paths:
      - 'dist/data/*.csv'                # Adjust if your CSVs are elsewhere
      - 'scripts/csv_to_json.py'
  workflow_dispatch:                     # Lets you run manually from Actions tab

permissions:
  contents: write                        # Needed for git commit & push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # Allows git commit later

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Debug - Show folder structure
        run: |
          pwd
          ls -la
          ls -la dist/ || echo "dist/ missing"
          ls -la dist/data/ || echo "dist/data missing"
          ls -la scripts/ || echo "scripts/ missing"
          ls -la scripts/csv* || echo "csv_to_json.py not found"

      - name: Convert CSV to JSON
        working-directory: scripts
        run: python csv_to_json.py

      - name: Commit generated JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add dist/data/*.json || true
          git commit -m "Auto-update JSON from CSV" || echo "No changes to commit"
          git push || echo "Push skipped"
