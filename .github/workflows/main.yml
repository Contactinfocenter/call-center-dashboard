name: CSV to JSON Automation

on:
  push:
    branches: [main]
    paths:
      - 'dist/data/call_logs/*.csv'
      - 'dist/data/drops/*.csv'
      - 'scripts/csv_to_json.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No cache line → avoids the error completely

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Verify folder structure (debug)
        run: |
          pwd
          ls -la
          ls -la dist/data/call_logs/ || echo "call_logs missing"
          ls -la dist/data/drops/ || echo "drops missing"
          ls -la data/ || echo "output data/ missing"
          ls -la scripts/csv_to_json.py || echo "script missing"

      - name: Run CSV → JSON conversion
        working-directory: ${{ github.workspace }}/scripts
        run: python csv_to_json.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and push generated JSON files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add data/detailed_call_logs.json data/detailed_drop_calls.json || true
          
          git diff --staged --quiet || git commit -m "chore: auto-update detailed JSON from CSV [ci skip]"
          
          git push origin HEAD:main || echo "Push skipped (no changes or protected branch)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated JSON (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-json
          path: data/*.json
          if-no-files-found: warn