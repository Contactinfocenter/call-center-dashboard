name: CSV to JSON Automation

on:
  push:
    branches: [main]
    paths:
      - 'dist/data/call_logs/*.csv'
      - 'dist/data/drops/*.csv'
      - 'scripts/csv_to_json.py'           # trigger when script changes too
  workflow_dispatch:                       # allow manual trigger from Actions tab

permissions:
  contents: write                          # required to commit & push back

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # needed for proper git commit history

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Verify folder structure (debug)
        run: |
          echo "Current working directory:"
          pwd
          echo "Listing root:"
          ls -la
          echo "dist/data/call_logs:"
          ls -la dist/data/call_logs/ || echo "→ directory not found"
          echo "dist/data/drops:"
          ls -la dist/data/drops/ || echo "→ directory not found"
          echo "scripts folder:"
          ls -la scripts/ || echo "→ scripts folder not found"
          echo "csv_to_json.py exists?"
          ls -la scripts/csv_to_json.py || echo "→ script missing"

      - name: Run CSV → JSON conversion
        working-directory: ${{ github.workspace }}/scripts
        run: python csv_to_json.py
        env:
          PYTHONUNBUFFERED: 1               # better real-time output

      - name: Commit and push generated JSON files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Stage only the files we care about
          git add data/detailed_call_logs.json data/detailed_drop_calls.json || true
          
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: auto-update detailed JSON from new CSV files"
          
          # Push (will fail gracefully if branch is protected)
          git push origin HEAD:main || echo "Push skipped (no changes or protected branch)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated JSON as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-json-files
          path: data/*.json
          if-no-files-found: warn